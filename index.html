<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Missed Class Information System
    </title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <div class="prototype-tag">
        Local Prototype • No Login
    </div>

    <!-- tb -->

    <section class="toolbar">

        <!-- search sub -->

        <input
            type="text"
            id="searchInput"
            placeholder="Search by subject..."
        >

        <input
            type="date"
            id="dateFilter"
        >

        <!-- sirts -->

        <button id="searchBtn">
            Search
        </button>

        <!-- scroll form -->

        <button id="focusFormBtn">
            + Add Record
        </button>

    </section>

    <!-- records area -->

    <section
        id="recordsContainer"
        class="records-container"
    >

        <!-- empty -->

        <div id="emptyState">

            <div class="empty-icon">
                📚
            </div>

            <h2>
                No Class Records Yet
            </h2>

            <p>
                Add your first class record below
                to share lessons, activities,
                assignments and announcements.
            </p>

        </div>

    </section>

    <!-- rec form -->

    <section
        id="recordFormArea"
        class="form-section"
    >

        <h2>
            Add Class Record
        </h2>

        <p class="form-subtitle">
            Fields marked * are required.
        </p>

        <form id="recordForm">

            <div class="form-grid">

                <div>

                    <label>
                        Subject *
                    </label>

                    <input
                        type="text"
                        id="subject"
                        placeholder="e.g. OOP 101"
                        required
                    >

                </div>

                <div>

                    <label>
                        Assignment / Activity
                    </label>

                    <input
                        type="text"
                        id="assignment"
                        placeholder="Enter assigned task"
                    >

                </div>

                <div>

                    <label>
                        Class Date *
                    </label>

                    <input
                        type="date"
                        id="classDate"
                        required
                    >

                </div>

                <div>

                    <label>
                        Deadline
                    </label>

                    <input
                        type="date"
                        id="deadline"
                    >

                </div>

                <div>

                    <label>
                        Lesson / Topic *
                    </label>

                    <input
                        type="text"
                        id="topic"
                        placeholder="e.g. Inheritance in Java"
                        required
                    >

                </div>

                <div>

                    <label>
                        Notes / Announcement
                    </label>

                    <textarea
                        id="notes"
                        placeholder="Enter important notes"
                    ></textarea>

                </div>

            </div>

            <div class="form-buttons">

                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Record
                </button>

                <button
                    type="reset"
                    class="cancel-btn"
                >
                    Cancel
                </button>

            </div>

        </form>

    </section>

    <footer>

        Prototype:
        Records are stored temporarily and
        reset when the page reloads.

    </footer>

    <script src="script.js"></script>

</body>

</html>
